services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ../backend:/app

  workers:
    build: ../backend
    command: python -m workers.main
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ../backend:/app
    restart: unless-stopped

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: morpheus
      POSTGRES_PASSWORD: morpheus
      POSTGRES_DB: morpheus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
